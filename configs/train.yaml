model: yolo11s.pt
epochs: 100
patience: 15          # early stopping
batch: 16
imgsz: 640
optimizer: AdamW
lr0: 0.001
lrf: 0.01             # final LR = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
mixup: 0.15           # MDA-style mixing
mosaic: 1.0
copy_paste: 0.1
degrees: 10.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
flipud: 0.1
fliplr: 0.5